<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Park</title>
    <link rel="icon" href="assets/imgs/favicon.png" />
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="arcade-ui main-menu">
    <main class="menu-home">
      <header>
        <h1 class="wordmark">TINY PARK</h1>
      </header>
      <nav class="home-options" aria-label="Main menu">
        <button class="menu-link" id="openCreate">CREATE ROOM</button>
        <button class="menu-link" id="openJoin">JOIN ROOM</button>
        <a class="menu-link" href="lvl.html">LEVEL EDITOR</a>
      </nav>
      <div class="park-floor" aria-hidden="true">
        <canvas id="menuCharacters" width="640" height="54"></canvas>
      </div>
      <p class="home-footnote">2 TEAMS. 5 ROUNDS. ONE WINNER.</p>
    </main>
    <dialog id="createDialog" class="menu-dialog">
      <form id="createForm">
        <header class="dialog-heading">
          <h2>CREATE ROOM</h2>
          <button
            class="close-dialog"
            type="button"
            data-close
            aria-label="Close"
          >
            &times;
          </button>
        </header>
        <label class="pixel-label"
          >YOUR NAME<input
            class="pixel-input username-input"
            maxlength="18"
            placeholder="Player"
            autocomplete="nickname"
        /></label>
        <label class="pixel-label"
          >GAME MODE<select class="pixel-select" id="gameMode">
            <option value="classic">Classic co-op</option>
            <option value="versus">Team versus</option>
          </select></label
        >
        <p class="pixel-status" id="hostModeHint">
          Work together through five rounds.
        </p>
        <button class="pixel-btn" id="createRoom" type="submit">CREATE</button>
      </form>
    </dialog>
    <dialog id="joinDialog" class="menu-dialog">
      <form id="joinForm">
        <header class="dialog-heading">
          <h2>JOIN ROOM</h2>
          <button
            class="close-dialog"
            type="button"
            data-close
            aria-label="Close"
          >
            &times;
          </button>
        </header>
        <label class="pixel-label"
          >YOUR NAME<input
            class="pixel-input username-input"
            maxlength="18"
            placeholder="Player"
            autocomplete="nickname"
        /></label>
        <label class="pixel-label"
          >ROOM CODE<input
            class="pixel-input room-input"
            id="codeInput"
            maxlength="12"
            required
            pattern="[A-Za-z0-9-]+"
            title="Enter the room code shown by your host"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="XXXXXXXX"
        /></label>
        <button class="pixel-btn" id="joinRoom" type="submit">JOIN</button>
      </form>
    </dialog>
    <script src="src/home.js"></script>
  </body>
</html>
